<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uma-IT</title>
<style>
:root {
  --bg: #0e1013;
  --panel: #16191e;
  --line: #23272e;
  --text: #e6e8ea;
  --muted: #8b929c;
  --accent: #4ade80;
  --accent-dim: #22c55e;
  --warn: #fbbf24;
  --bad: #f87171;
  --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f8f9;
    --panel: #ffffff;
    --line: #e3e6ea;
    --text: #14171a;
    --muted: #656d78;
    --accent: #16a34a;
    --accent-dim: #15803d;
  }
}
* { box-sizing: border-box; }
/* The UA stylesheet's [hidden] rule loses to any class that sets display, so
   .summary and .controls stayed visible when hidden was set on them. */
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }

header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; }
#conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex;
        align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--accent); }
.dot.off { background: var(--bad); }

.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.card h2 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin: 0 0 16px;
}

.state { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.state b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.state .tag {
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted);
}
.metrics { display: flex; gap: 28px; margin-top: 18px; flex-wrap: wrap; }
.metric .k { font-size: 11px; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.06em; }
.metric .v { font-size: 19px; font-variant-numeric: tabular-nums;
             font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

.controls { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 13px; padding: 8px 15px; border-radius: 7px;
  border: 1px solid var(--line); background: transparent; color: var(--text);
  cursor: pointer; transition: border-color .12s, background .12s, opacity .12s;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .35; cursor: default; }
button.primary { background: var(--accent-dim); border-color: var(--accent-dim);
                 color: #fff; font-weight: 500; }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
button.quiet { color: var(--muted); }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }

.field { display: flex; align-items: center; gap: 14px; padding: 9px 0;
         border-bottom: 1px solid var(--line); }
.field:last-of-type { border-bottom: 0; }
.field label { flex: 1; font-size: 14px; }
.field .hint { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.field input[type=text], .field input[type=number], .field select {
  font: inherit; font-size: 14px; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px;
  min-width: 0;
}
.field input[type=text] { width: 210px; }
.field input[type=number] { width: 86px; text-align: right;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.field select { width: 210px; }
input:focus, select:focus { outline: none; border-color: var(--accent-dim); }

.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px; background: var(--line);
  transition: background .15s; pointer-events: none;
}
.switch span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s;
}
.switch input:checked + span { background: var(--accent-dim); }
.switch input:checked + span::after { transform: translateX(16px); background: #fff; }
/* The input itself is transparent, so its focus ring would be invisible.
   Put one on the part that is actually drawn. */
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.summary { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.summary div { font-size: 13px; }
.summary .k { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; }

/* Sections that only exist when their feature is on. Kept out of the default
   view so the form stays the seven fields a run actually needs. */
.block { padding: 4px 0 2px 14px; margin: 2px 0 6px; border-left: 2px solid var(--line); }
.block > .field:first-child { padding-top: 4px; }
.block .field { border-bottom: 0; padding: 7px 0; }
.block .field label { font-size: 13px; }

.tagbox { flex: 1; min-width: 0; }
.presetbox { display: flex; gap: 6px; align-items: center; }
.presetbox select, .presetbox input[type=text] { width: 150px; }
.presetbox button { padding: 7px 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  padding: 3px 5px 3px 9px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line);
}
.chip button {
  all: unset; cursor: pointer; line-height: 1; padding: 0 3px; border-radius: 999px;
  color: var(--muted); font-size: 13px;
}
.chip button:hover { color: var(--bad); }
.tagbox input { width: 100%; }

.sparks { display: flex; flex-wrap: wrap; gap: 5px; }
.spark {
  font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  cursor: pointer;
}
.spark:hover { border-color: var(--muted); }
.spark.on { color: var(--text); border-color: var(--accent-dim); }
.spark .st { color: var(--accent); font-size: 11px; }
.sparks .sep { flex-basis: 100%; height: 0; }

/* A white-spark requirement: a bordered row of alternatives. The border is
   what carries the meaning - inside it is "or", between boxes is "and" - so it
   has to read as a container rather than a list item. */
.reqrow {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  margin-bottom: 6px; background: var(--bg);
}
.reqrow .chips { margin-bottom: 4px; }
/* The theme's control styling is scoped to .field, and these live in .reqrow,
   so without this the picker renders in the browser's default white against a
   dark panel. */
.reqrow select {
  width: 100%; font: inherit; font-size: 13px;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px;
}
.reqrow .orline { font-size: 11px; color: var(--muted); margin-bottom: 4px;
                  text-transform: uppercase; letter-spacing: 0.06em; }
.reqjoin { font-size: 11px; color: var(--muted); text-transform: uppercase;
           letter-spacing: 0.08em; margin: 0 0 6px 2px; }
.chip .st { color: var(--accent); font-size: 11px; cursor: pointer; }

.seg { display: flex; gap: 0; }
.seg button {
  border-radius: 0; font-size: 12px; padding: 6px 12px; color: var(--muted);
}
.seg button:first-child { border-radius: 7px 0 0 7px; }
.seg button:last-child { border-radius: 0 7px 7px 0; margin-left: -1px; }
.seg button.on { color: var(--text); border-color: var(--accent-dim); z-index: 1; }

pre#log {
  margin: 0; max-height: 300px; overflow: auto; font-size: 12px; line-height: 1.55;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--muted); white-space: pre-wrap; word-break: break-word;
}
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; }
#note { font-size: 12px; color: var(--muted); margin-top: 14px; min-height: 1em; }
#note.bad { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Uma-IT</h1>
  <span class="sub">Independent Training loop</span>
  <span id="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting</span></span>
</header>

<section class="card">
  <h2>Status</h2>
  <div class="state">
    <b id="state">—</b>
    <span class="tag" id="tag" hidden></span>
  </div>
  <div class="metrics">
    <div class="metric"><div class="k">Time left</div><div class="v" id="remaining">—</div></div>
    <div class="metric"><div class="k">Runs done</div><div class="v" id="runs">—</div></div>
    <div class="metric"><div class="k">Sparks met</div><div class="v" id="sparkmet">—</div></div>
    <div class="metric"><div class="k">Limit</div><div class="v" id="limit">—</div></div>
  </div>
  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button id="finish">Stop after this run</button>
    <button class="quiet" id="stop">Stop</button>
  </div>
  <div id="note"></div>
</section>

<!-- Top level, not inside the skill section, because both lists go stale for
     the same reason and the skill section is hidden when skill buying is off -
     which left someone using only spark reroll with no way to reach this. -->
<section class="card">
  <h2>Game data</h2>
  <div class="row">
    <span class="hint grow" id="data-version">—</span>
    <button id="data-sync">Update data</button>
    <button class="quiet danger" id="data-prune">Remove unknown skills</button>
  </div>
  <!-- Shown only when the game database is not where it usually is. A browser
       cannot hand the server a folder path, so this is typed. -->
  <div class="row" id="data-pick" hidden style="margin-top:10px">
    <input type="text" class="grow" id="data-path"
           placeholder="Path to the game folder, or to master.mdb">
    <button id="data-go">Use this folder</button>
  </div>
  <div id="data-note"></div>
</section>

<section class="card">
  <h2>Task</h2>
  <div id="task-view">
    <p class="empty" id="no-task">No task yet.</p>
    <div class="summary" id="summary" hidden></div>
    <div class="controls" id="task-actions" hidden>
      <button id="edit">Edit</button>
      <button class="quiet danger" id="delete">Delete</button>
    </div>
    <div class="controls" id="new-actions" hidden>
      <button class="primary" id="new">Create task</button>
    </div>
  </div>

  <form id="form" hidden>
    <div class="field">
      <label for="scenario">Scenario</label>
      <select id="scenario">
        <option value="4">Grand Concert</option>
        <option value="3">Trackblazer</option>
        <option value="1">URA Finale</option>
        <option value="2">Aoharu Cup</option>
      </select>
    </div>
    <div class="field">
      <label for="card">Support card to borrow
        <span class="hint">Must match the in-game name exactly — it is read off the screen</span>
      </label>
      <input type="text" id="card" placeholder="Wave of Gratitude">
    </div>
    <div class="field">
      <label for="loops">Run limit
        <span class="hint">0 runs until stopped</span>
      </label>
      <input type="number" id="loops" min="0" value="0">
    </div>
    <div class="field">
      <label for="parents">Keep the last legacy
        <span class="hint">Off runs the game's auto-select each career</span>
      </label>
      <span class="switch"><input type="checkbox" id="parents" checked><span></span></span>
    </div>
    <div class="field">
      <label for="skills">Skip skill buying
        <span class="hint">Off spends the career's skill points on the priorities below</span>
      </label>
      <span class="switch"><input type="checkbox" id="skills" checked><span></span></span>
    </div>
    <div class="block" id="skills-block" hidden>
      <div class="field">
        <label for="preset-select">Preset
          <span class="hint">A saved set of priorities and blacklist</span>
        </label>
        <div class="presetbox">
          <select id="preset-select"><option value="">No presets saved</option></select>
          <button type="button" id="preset-load">Load</button>
          <button type="button" class="quiet danger" id="preset-delete">Delete</button>
        </div>
      </div>
      <div class="field">
        <label for="preset-name">Save as
          <span class="hint">An existing name overwrites it</span>
        </label>
        <div class="presetbox">
          <input type="text" id="preset-name" placeholder="Preset name">
          <button type="button" id="preset-save">Save</button>
        </div>
      </div>

      <div class="field">
        <label>Priority 1<span class="hint">Bought first, while points last</span></label>
        <div class="tagbox" id="tier0"></div>
      </div>
      <div class="field">
        <label>Priority 2</label>
        <div class="tagbox" id="tier1"></div>
      </div>
      <div class="field">
        <label>Priority 3</label>
        <div class="tagbox" id="tier2"></div>
      </div>
      <div class="field">
        <label>Never buy</label>
        <div class="tagbox" id="blacklist"></div>
      </div>
      <div class="field">
        <label for="onlymine">Only buy what I list
          <span class="hint">Off falls back to a built-in tier list once yours runs out</span>
        </label>
        <span class="switch"><input type="checkbox" id="onlymine"><span></span></span>
      </div>
    </div>

    <div class="field">
      <label for="reroll">Reroll sparks
        <span class="hint">Pays 30 TP for a second roll when the first has none you want</span>
      </label>
      <span class="switch"><input type="checkbox" id="reroll"><span></span></span>
    </div>

    <div class="block" id="spark-block" hidden>
      <div class="field">
        <label>Sparks worth keeping
          <span class="hint">Click to set the stars each must reach</span>
        </label>
      </div>
      <div class="sparks" id="sparks"></div>
      <div class="field">
        <label>Needs
          <span class="hint">Blue and pink are separate groups</span>
        </label>
        <div class="seg">
          <button type="button" id="mode-or" data-mode="or">Either group</button>
          <button type="button" id="mode-and" data-mode="and">Both groups</button>
        </div>
      </div>

      <!-- White sparks: skills, races and scenarios. Requirement rows rather
           than a chain of operators - every row must hold, any one entry holds
           its row - so the structure is the precedence and there is nothing to
           disambiguate. One entry per row is a pure AND; one row holding
           everything is a pure OR. -->
      <div class="field">
        <label>Skill sparks
          <span class="hint">Needs every row. Any one entry satisfies its row</span>
        </label>
      </div>
      <div id="skill-reqs"></div>
      <div class="presetbox">
        <button type="button" id="req-add">+ Add requirement</button>
      </div>
      <div class="field">
        <label>Keeps a roll with
          <span class="hint" id="rule-readback">nothing targeted yet</span>
        </label>
      </div>
      <div class="field">
        <label for="stopreroll">Stop at the reroll screen
          <span class="hint">Ends a single-run task there so you can reroll by hand</span>
        </label>
        <span class="switch"><input type="checkbox" id="stopreroll"><span></span></span>
      </div>
    </div>

    <div class="field">
      <label for="tp">Restore TP when it runs out
        <span class="hint">Uses a TP item if you hold one, carats otherwise. A chocolate item is never spent. Off waits for TP instead.</span>
      </label>
      <span class="switch"><input type="checkbox" id="tp"><span></span></span>
    </div>

    <div class="field">
      <label for="teamtrials">Run team trials with spare RP
        <span class="hint">While a career runs itself and while waiting for TP. Spends RP, which nothing else here uses and which stops building up once it caps at 5.</span>
      </label>
      <span class="switch"><input type="checkbox" id="teamtrials"><span></span></span>
    </div>
    <div class="controls">
      <button type="submit" class="primary" id="save">Save task</button>
      <button type="button" class="quiet" id="cancel">Cancel</button>
    </div>
    <datalist id="skill-names"></datalist>
  </form>
</section>

<section class="card">
  <h2>
    <span class="row"><span class="grow">Log</span></span>
  </h2>
  <pre id="log">—</pre>
</section>

</div>

<script>
"use strict";

// Same origin, always. The parent project hardcoded an absolute base URL, so
// serving the page anywhere but port 8071 silently talked to whatever bot was
// on 8071 instead of the one serving the page.
const api = (path, opts) => fetch(path, opts);

const SCENARIOS = { 1: "URA Finale", 2: "Aoharu Cup", 3: "Trackblazer", 4: "Grand Concert" };
const STATUS = { 1: "Pending", 2: "Running", 3: "Interrupted", 4: "Done", 5: "Failed",
                 6: "Scheduled", 7: "Cancelled" };

const $ = (id) => document.getElementById(id);

// The spark names the bot can match, in the two groups it scores separately.
// uma_it/parse.py is the source of truth; check_ui.py fails if these drift.
const SPARK_BLUE = ["Speed", "Stamina", "Power", "Guts", "Wit"];
const SPARK_PINK = ["Turf", "Dirt", "Sprint", "Mile", "Medium", "Long",
                    "Front Runner", "Pace Chaser", "Late Surger", "End Closer"];
let task = null;
let editing = false;
let noteTimer = null;
let sparkTargets = {};   // name -> minimum stars
let sparkMode = "or";
const tagBoxes = {};     // id -> TagBox

/* A list of names, edited as chips. Used for the three skill tiers and the
   blacklist. Autocomplete matters here: a skill name is OCR'd off the screen
   and fuzzy-matched against the shipped database, so a typo is a skill that
   never gets bought and nothing says why. */
class TagBox {
  constructor(id) {
    this.el = $(id);
    this.values = [];
    this.chips = document.createElement("div");
    this.chips.className = "chips";
    this.input = document.createElement("input");
    this.input.type = "text";
    this.input.setAttribute("list", "skill-names");
    this.input.placeholder = "Add a skill…";
    this.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); this.add(this.input.value); }
      else if (e.key === "Backspace" && !this.input.value) this.remove(this.values.length - 1);
    });
    // Picking from the datalist fires input, not keydown.
    this.input.addEventListener("input", () => {
      if (SKILL_NAMES.has(this.input.value)) this.add(this.input.value);
    });
    this.el.append(this.chips, this.input);
  }
  set(values) { this.values = (values || []).slice(); this.render(); }
  get() { return this.values.slice(); }
  add(name) {
    name = (name || "").trim();
    if (name && !this.values.includes(name)) this.values.push(name);
    this.input.value = "";
    this.render();
  }
  remove(i) { if (i >= 0) { this.values.splice(i, 1); this.render(); } }
  render() {
    this.chips.replaceChildren(...this.values.map((name, i) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.append(name);
      const x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.title = "Remove " + name;
      x.onclick = () => this.remove(i);
      chip.append(x);
      return chip;
    }));
  }
}

let SKILL_NAMES = new Set();

async function loadSkillNames() {
  try {
    const data = await api("/api/skills").then((r) => r.json());
    const names = (Array.isArray(data) ? data : []).map((s) => s && s.name).filter(Boolean);
    SKILL_NAMES = new Set(names);
    $("skill-names").replaceChildren(...names.map((n) => {
      const o = document.createElement("option");
      o.value = n;
      return o;
    }));
  } catch (e) {
    // Autocomplete is a convenience; typing a name by hand still works.
  }
}

/* Topping the skill list up from the game's own database.

   The bot fuzzy-matches an OCR'd skill name against this list, so a skill it
   has never heard of cannot be bought and nothing says why. Pressing this
   after a game update teaches it the new ones.

   A browser cannot give the server a filesystem path - a folder picker returns
   a handle, not a path, and the server is what opens the file. So the first
   press tries the usual location, and only asks if that fails. */
/* Which game version the list is current to. Shown next to the buttons so it
   is obvious when the list has fallen behind an update - the failure it
   prevents is silent, a skill that simply never gets bought. */
async function showDataVersion(meta) {
  const el = $("data-version");
  try {
    if (!meta) {
      const src = await api("/api/skills/source").then((r) => r.json());
      meta = src.meta;
    }
    if (!meta || !meta.skills) { el.textContent = "No game data read yet"; return; }
    const ver = meta.game_version ? `game ${meta.game_version}` : "unknown game version";
    const when = meta.master_mdb_date ? `, data ${meta.master_mdb_date}` : "";
    const sp = meta.sparks ? ` and ${meta.sparks} sparks` : "";
    el.textContent = `${meta.skills} skills${sp}, current to ${ver}${when}`;
  } catch (e) {
    el.textContent = "";
  }
}

/* One press, both lists. Skills and sparks come out of the same master.mdb and
   go stale on the same game update, so splitting them into two buttons would
   only create a state where one is current and the other is not. */
async function updateGameData(path) {
  const note = $("data-note");
  const btn = $("data-sync");
  btn.disabled = true;
  note.textContent = "Reading the game database…";
  try {
    const res = await api("/api/skills/sync", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path || "" }),
    }).then((r) => r.json());

    if (res.ret !== 0) {
      // Not an error the user caused: their install is somewhere else.
      $("data-pick").hidden = false;
      note.textContent = "Could not find master.mdb. Pick the game folder.";
      return;
    }
    $("data-pick").hidden = true;
    const bits = [];
    if (res.added_count) bits.push(`${res.added_count} skill${res.added_count === 1 ? "" : "s"}`);
    if (res.sparks_added) bits.push(`${res.sparks_added} spark${res.sparks_added === 1 ? "" : "s"}`);
    note.textContent = bits.length
      ? `Added ${bits.join(" and ")}`
      : "Already up to date";
    if (res.added_count) {
      note.title = res.added.join(", ");
      await loadSkillNames();
    }
    await showDataVersion(res.meta);
  } catch (e) {
    note.textContent = "Update failed: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

/* Dropping entries for skills the game does not have. A scraped list carries
   names the game never shows, and they are not free: the matcher scores an
   OCR'd name against every candidate, so a name that cannot appear can still
   win a frame. Confirmed first, because unlike the sync this one deletes. */
async function pruneSkills() {
  const note = $("data-note");
  if (!confirm("Remove every skill the game's own database does not have?\n\n"
               + "Your priorities and blacklist are not touched, and you can "
               + "rebuild the list with Update data.")) return;
  const btn = $("data-prune");
  btn.disabled = true;
  note.textContent = "Comparing against the game database…";
  try {
    const res = await api("/api/skills/prune", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: "" }),
    }).then((r) => r.json());
    if (res.ret !== 0) {
      note.textContent = res.msg || "Could not prune.";
      return;
    }
    note.textContent = res.removed_count
      ? `Removed ${res.removed_count} unknown skill${res.removed_count === 1 ? "" : "s"} (${res.total} left)`
      : `Nothing to remove (${res.total} skills)`;
    if (res.removed_count) await loadSkillNames();
    await showDataVersion(res.meta);
  } catch (e) {
    note.textContent = "Prune failed: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

/* White spark requirements.

   State is [[{name, stars}, ...], ...]: the outer list is ANDed, each inner
   list is ORed. The border in the markup is the only thing that says so, which
   is why the readback under it spells the rule out in words - a rule that
   reads wrong should be visible before it costs a 30 TP reroll. */
let SPARK_BY_KIND = {};
let skillReqs = [];

/* The pickable sparks, grouped the way the game groups them.

   A dropdown rather than a text box with autocomplete: a typed name that is
   not in the vocabulary can never match a screen read, and a rule containing
   one looks exactly like a rule that simply did not hold. The select cannot
   express that mistake. It also makes the four scenario sparks findable
   without knowing they exist, which a text box does not.

   Scenarios first, then races, then skills - smallest and most sought at the
   top, since 234 skills would otherwise bury the four that matter most. */
const SPARK_GROUPS = [["scenario", "Scenarios"], ["race", "Races"],
                      ["skill", "Skills"], ["other", "Other"]];

async function loadSparkNames() {
  try {
    const data = await api("/api/sparks").then((r) => r.json());
    const by = {};
    (Array.isArray(data) ? data : []).forEach((s) => {
      if (!s || !s.name) return;
      (by[s.kind] = by[s.kind] || []).push(s.name);
    });
    Object.values(by).forEach((list) => list.sort((a, b) => a.localeCompare(b)));
    SPARK_BY_KIND = by;
  } catch (e) {
    // Leaves the picker empty rather than letting a stale list look current.
  }
  renderReqs();
}

function sparkPicker() {
  const sel = document.createElement("select");
  const first = document.createElement("option");
  first.value = "";
  first.textContent = "Add a spark…";
  sel.append(first);
  SPARK_GROUPS.forEach(([kind, label]) => {
    const names = SPARK_BY_KIND[kind] || [];
    if (!names.length) return;
    const group = document.createElement("optgroup");
    group.label = `${label} (${names.length})`;
    names.forEach((n) => {
      const o = document.createElement("option");
      o.value = n;
      o.textContent = n;
      group.append(o);
    });
    sel.append(group);
  });
  return sel;
}

function renderReqs() {
  const host = $("skill-reqs");
  host.replaceChildren();
  skillReqs.forEach((entries, ri) => {
    if (ri) {
      const join = document.createElement("div");
      join.className = "reqjoin";
      join.textContent = "and";
      host.append(join);
    }
    const box = document.createElement("div");
    box.className = "reqrow";
    const chips = document.createElement("div");
    chips.className = "chips";
    entries.forEach((entry, ei) => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.append(entry.name + " ");
      // Stars cycle 1 -> 2 -> 3 -> 1, the same gesture as the blue/pink chips.
      const st = document.createElement("span");
      st.className = "st";
      st.textContent = "★".repeat(entry.stars) + "☆".repeat(3 - entry.stars);
      st.title = "Click to change the stars needed";
      st.onclick = () => { entry.stars = (entry.stars % 3) + 1; renderReqs(); };
      chip.append(st);
      const x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.onclick = () => {
        entries.splice(ei, 1);
        if (!entries.length) skillReqs.splice(ri, 1);
        renderReqs();
      };
      chip.append(x);
      chips.append(chip);
    });
    box.append(chips);
    const pick = sparkPicker();
    if (entries.length) pick.firstChild.textContent = "or…";
    pick.onchange = () => {
      const name = pick.value;
      if (name && !entries.some((e) => e.name === name)) {
        entries.push({ name: name, stars: 1 });
      }
      pick.value = "";
      renderReqs();
    };
    box.append(pick);
    host.append(box);
  });
  showReadback();
}

function setReqs(rows) {
  skillReqs = (Array.isArray(rows) ? rows : []).map((row) =>
    (Array.isArray(row) ? row : []).map((e) => ({
      name: String((e && e.name) || e || ""),
      stars: Math.min(3, Math.max(1, parseInt((e && e.stars) || 1, 10) || 1)),
    })).filter((e) => e.name)).filter((row) => row.length);
  renderReqs();
}

function getReqs() {
  return skillReqs.filter((r) => r.length).map((r) => r.map((e) => ({ name: e.name, stars: e.stars })));
}

/* The rule in words. Without this the only statement of what was configured is
   a set of boxes, and "needs every row" is exactly the kind of thing people
   read the other way round. */
function showReadback() {
  /* Written the way the bot decides (`spark_rule_check`): a roll has one blue
     and one pink spark, so any blue target satisfies the blue group and any
     pink the pink group. Both needs a hit in each group, Either a hit in
     either; each white row is one more any-of, and every clause must hold.
     This used to join every colour target with the Either/Both word, so
     Both read "Power and Stamina and Long and Turf" - a roll that cannot
     exist, and not what the bot checks. */
  const clauses = [];
  const colour = sparkTargets || {};
  const star = (name, stars) => `${name} ${stars}★`;
  const isBlue = (n) => SPARK_BLUE.some((b) => b.toLowerCase() === String(n).toLowerCase());
  const names = Object.keys(colour);
  const blue = names.filter(isBlue).map((n) => star(n, colour[n]));
  const pink = names.filter((n) => !isBlue(n)).map((n) => star(n, colour[n]));
  if (sparkMode === "and" && blue.length && pink.length) {
    clauses.push(blue, pink);
  } else if (blue.length || pink.length) {
    clauses.push(blue.concat(pink));
  }
  getReqs().forEach((row) => clauses.push(row.map((e) => star(e.name, e.stars))));
  $("rule-readback").textContent = clauses.length
    ? clauses.map((c) => (clauses.length > 1 && c.length > 1 ? `(${c.join(" or ")})` : c.join(" or ")))
        .join(" and ")
    : "nothing targeted yet";
}

let presetList = [];

async function loadPresets(select) {
  try {
    presetList = await api("/api/skill-presets").then((r) => r.json());
  } catch (e) {
    presetList = [];
  }
  const sel = $("preset-select");
  const keep = select || sel.value;
  sel.replaceChildren();
  if (!presetList.length) {
    const o = document.createElement("option");
    o.value = ""; o.textContent = "No presets saved";
    sel.append(o);
  } else {
    for (const p of presetList) {
      const o = document.createElement("option");
      o.value = p.name;
      o.textContent = `${p.name} (${p.tiers.reduce((a, t) => a + t.length, 0)})`;
      sel.append(o);
    }
    if (keep && presetList.some((p) => p.name === keep)) sel.value = keep;
  }
  $("preset-load").disabled = !presetList.length;
  $("preset-delete").disabled = !presetList.length;
}

/* Load a preset into the form. It does not save - the task is only changed
   when the form is, which keeps "try a preset" from being destructive. */
function applyPreset() {
  const p = presetList.find((x) => x.name === $("preset-select").value);
  if (!p) return;
  for (let i = 0; i < 3; i++) tagBoxes["tier" + i].set(p.tiers[i] || []);
  tagBoxes.blacklist.set(p.blacklist || []);
  $("onlymine").checked = !!p.only_user_provided;
  $("preset-name").value = p.name;
  note(`Loaded preset "${p.name}" - save the task to keep it`);
}

async function savePreset() {
  const name = ($("preset-name").value || $("preset-select").value || "").trim();
  if (!name) { note("Give the preset a name first", true); return; }
  if (presetList.some((p) => p.name === name) &&
      !confirm(`Overwrite the preset "${name}"?`)) return;
  try {
    const res = await api("/api/skill-presets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name,
        tiers: [0, 1, 2].map((i) => tagBoxes["tier" + i].get()),
        blacklist: tagBoxes.blacklist.get(),
        only_user_provided: $("onlymine").checked,
      }),
    });
    const body = await res.json();
    if (!res.ok || body.ret !== 0) throw new Error(body.msg || "HTTP " + res.status);
    await loadPresets(body.name);
    note(`Preset "${body.name}" saved`);
  } catch (e) {
    note("Could not save the preset: " + e.message, true);
  }
}

async function deletePreset() {
  const name = $("preset-select").value;
  if (!name || !confirm(`Delete the preset "${name}"?`)) return;
  try {
    await api("/api/skill-presets", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    await loadPresets();
    note(`Preset "${name}" deleted`);
  } catch (e) {
    note("Could not delete the preset: " + e.message, true);
  }
}

function buildSparks() {
  const host = $("sparks");
  const make = (name) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "spark";
    b.dataset.name = name;
    b.onclick = () => {
      // off -> 1 -> 2 -> 3 -> off
      const next = ((sparkTargets[name] || 0) + 1) % 4;
      if (next) sparkTargets[name] = next; else delete sparkTargets[name];
      renderSparks();
    };
    return b;
  };
  const sep = document.createElement("span");
  sep.className = "sep";
  host.replaceChildren(...SPARK_BLUE.map(make), sep, ...SPARK_PINK.map(make));
  renderSparks();
}

function renderSparks() {
  for (const b of $("sparks").querySelectorAll(".spark")) {
    const stars = sparkTargets[b.dataset.name] || 0;
    b.classList.toggle("on", stars > 0);
    b.replaceChildren(b.dataset.name);
    if (stars) {
      const s = document.createElement("span");
      s.className = "st";
      s.textContent = " " + "★".repeat(stars);
      b.append(s);
    }
  }
  showReadback();
  $("mode-or").classList.toggle("on", sparkMode === "or");
  $("mode-and").classList.toggle("on", sparkMode === "and");
}

function note(text, bad) {
  const el = $("note");
  el.textContent = text || "";
  el.classList.toggle("bad", !!bad);
  clearTimeout(noteTimer);
  if (text) noteTimer = setTimeout(() => { el.textContent = ""; }, 4000);
}

function setConnected(ok) {
  $("conn-dot").className = "dot " + (ok ? "on" : "off");
  $("conn-text").textContent = ok ? "connected" : "no connection";
}

async function refresh() {
  try {
    const [status, state, tasks] = await Promise.all([
      api("/action/bot/status").then((r) => r.json()),
      api("/api/runtime-state").then((r) => r.json()),
      api("/task").then((r) => r.json()),
    ]);
    setConnected(true);
    task = Array.isArray(tasks) && tasks.length ? tasks[0] : null;
    render(status, state);
  } catch (e) {
    setConnected(false);
  }
}

/* True when the task has run every career it was asked for.
   The scheduler stays "running" after the last one - it only means its thread
   is alive, and it will not restart a task that has reached its limit - so
   "running" and "finished" look identical from the status endpoint alone. */
function isFinished(d) {
  if (!task || !d) return false;
  const limit = d.loop_count || 0;
  return limit > 0 && (d.loops_done || 0) >= limit &&
         task.task_status === 4;           // SUCCESS
}

function render(status, state) {
  const it = (state && state.independent_training) || {};
  const running = status.status === "running" || status.status === "finishing";
  const d = task && task.detail;
  const finished = isFinished(d);

  // Short of TP, the bot holds the next career rather than failing it, so the
  // scheduler is running with nothing happening. Say which it is.
  const waitUntil = d && d.resume_after ? d.resume_after * 1000 : 0;
  const waiting = running && !finished && waitUntil > Date.now();

  $("state").textContent = finished
    ? "Done"
    : waiting ? (d.tt_pending ? "Team trials" : "Waiting for TP")
    : running ? (it.active ? "Training" : "Running")
    : status.status === "stopped" ? "Stopped" : status.status;

  const tag = $("tag");
  if (finished) {
    tag.hidden = false;
    tag.textContent = `${d.loops_done} of ${d.loop_count} careers`;
  } else if (waiting) {
    tag.hidden = false;
    const mins = Math.max(1, Math.round((waitUntil - Date.now()) / 60000));
    tag.textContent = `next career in ~${mins} min`;
  } else if (status.stop_after_run) {
    tag.hidden = false;
    tag.textContent = "stopping after this run";
  } else if (task && task.task_status && STATUS[task.task_status] && !running) {
    tag.hidden = false;
    tag.textContent = STATUS[task.task_status].toLowerCase();
  } else {
    tag.hidden = true;
  }

  $("remaining").textContent = it.remaining || "—";
  $("runs").textContent = d ? (d.loops_done ?? 0) : "—";
  // Runs whose kept sparks met every requirement, out of the runs done.
  $("sparkmet").textContent = !d ? "—"
    : !d.spark_reroll_enabled ? "off"
    : `${d.spark_goal_runs ?? 0} of ${d.loops_done ?? 0}`;
  $("limit").textContent = d ? (d.loop_count ? d.loop_count : "∞") : "—";

  // Start does nothing once the limit is reached: the scheduler leaves a task
  // at SUCCESS and never restarts it, and reset-task only sets PENDING, which
  // it flips straight back. Running again means clearing the count.
  $("start").textContent = finished ? "Run again" : "Start";
  $("start").onclick = finished ? runAgain
                                : () => act("/action/bot/start", "Started");
  // Not `running || !task`: the scheduler reports "running" after the last
  // career too, so that disabled Run again exactly when it is wanted.
  $("start").disabled = !task || (running && !finished);
  // Meaningless once the loop is done - there is no run to stop after.
  $("finish").disabled = !running || status.stop_after_run || finished;
  $("stop").disabled = !running;

  if (!editing) renderTask();
  if (task) loadLog(task.task_id);
}

function renderTask() {
  $("form").hidden = true;
  $("task-view").hidden = false;
  $("no-task").hidden = !!task;
  $("summary").hidden = !task;
  $("task-actions").hidden = !task;
  $("new-actions").hidden = !!task;
  if (!task) return;

  const d = task.detail || {};
  $("summary").innerHTML = [
    ["Scenario", SCENARIOS[d.scenario] || d.scenario],
    ["Card", d.follow_support_card_name || "any"],
    ["Legacy", d.use_last_parents ? "keep last" : "auto-select"],
    ["Skills", d.skip_learn_skill ? "skipped" : "requested"],
    ["TP", d.allow_recover_tp ? "may spend" : "never spend"],
    ["Team trials", d.team_trials_while_waiting ? "with spare RP" : "off"],
    ...(d.skip_learn_skill ? [] : [["Priorities", tierSummary(d)]]),
    ...(d.spark_reroll_enabled ? [["Reroll", sparkSummary(d)]] : []),
  ].map(([k, v]) => `<div><span class="k">${k}</span> ${v}</div>`).join("");
}

function tierSummary(d) {
  const n = (d.learn_skill_list || []).reduce((a, t) => a + (t || []).length, 0);
  if (!n) return "built-in tiers";
  return `${n} skill${n === 1 ? "" : "s"}` +
         (d.learn_skill_only_user_provided ? ", only these" : "");
}

function sparkSummary(d) {
  const t = d.spark_reroll_targets || {};
  const names = Object.keys(t);
  if (!names.length) return "no targets - will not reroll";
  const shown = names.map((k) => `${k} ${t[k]}★`).join(", ");
  return shown + (d.spark_reroll_mode === "and" ? " (both groups)" : "");
}

function openForm() {
  editing = true;
  const d = (task && task.detail) || {};
  $("scenario").value = String(d.scenario ?? 4);
  $("card").value = d.follow_support_card_name || "";
  $("loops").value = d.loop_count ?? 0;
  $("parents").checked = d.use_last_parents ?? true;
  $("skills").checked = d.skip_learn_skill ?? true;
  $("tp").checked = !!d.allow_recover_tp;
  $("teamtrials").checked = !!d.team_trials_while_waiting;

  const tiers = d.learn_skill_list || [];
  for (let i = 0; i < 3; i++) tagBoxes["tier" + i].set(tiers[i] || []);
  tagBoxes.blacklist.set(d.learn_skill_blacklist || []);
  $("onlymine").checked = !!d.learn_skill_only_user_provided;

  sparkTargets = Object.assign({}, d.spark_reroll_targets || {});
  setReqs(d.spark_skill_targets || []);
  sparkMode = d.spark_reroll_mode === "and" ? "and" : "or";
  $("reroll").checked = !!d.spark_reroll_enabled;
  $("stopreroll").checked = !!d.stop_at_spark_reroll;
  renderSparks();
  syncBlocks();

  $("task-view").hidden = true;
  $("form").hidden = false;
}

/* Each feature's settings only exist while the feature is on. */
function syncBlocks() {
  $("skills-block").hidden = $("skills").checked;
  $("spark-block").hidden = !$("reroll").checked;
}

function closeForm() {
  editing = false;
  $("form").hidden = true;
  $("task-view").hidden = false;
  renderTask();
}

/* Replace the saved task with this payload. The API has no update, so a
   change is a delete followed by an add. */
async function writeTask(payload) {
  if (task) {
    await api("/task", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: task.task_id }),
    });
  }
  const res = await api("/task", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      app_name: "uma-it",
      task_execute_mode: 3,
      task_type: 1,
      task_desc: "Training",
      attachment_data: payload,
    }),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}

/* Start the same task over. Clearing loops_done is the whole trick: the
   scheduler leaves a task at SUCCESS once the count reaches the limit, and
   reset-task only sets PENDING, which it flips straight back to SUCCESS on the
   next tick. */
async function runAgain() {
  if (!task) return;
  $("start").disabled = true;
  try {
    /* consecutive_failures too: three in a row stop the loop, and a user
       pressing Run again means "start fresh", not "start one failure from
       stopping again". The spark goal count too: it counts this session. */
    await writeTask(Object.assign({}, task.detail,
                                  { loops_done: 0, consecutive_failures: 0,
                                    spark_goal_runs: 0 }));
    await refresh();
    const res = await api("/action/bot/start", { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    note(`Running ${task.detail.loop_count} more career(s)`);
    await refresh();
  } catch (e) {
    note("Could not run again: " + e.message, true);
  } finally {
    $("start").disabled = false;
  }
}

async function saveTask(ev) {
  ev.preventDefault();
  const payload = {
    scenario: Number($("scenario").value),
    follow_support_card_name: $("card").value.trim(),
    loop_count: Number($("loops").value) || 0,
    // Carried forward so editing a task does not reset the run count.
    loops_done: (task && task.detail && task.detail.loops_done) || 0,
    spark_goal_runs: (task && task.detail && task.detail.spark_goal_runs) || 0,
    // Kept so saving a task mid-wait does not send it straight back to a
    // career the game will refuse.
    resume_after: (task && task.detail && task.detail.resume_after) || 0,
    use_last_parents: $("parents").checked,
    skip_learn_skill: $("skills").checked,
    learn_skill_list: [0, 1, 2].map((i) => tagBoxes["tier" + i].get()),
    learn_skill_blacklist: tagBoxes.blacklist.get(),
    learn_skill_only_user_provided: $("onlymine").checked,
    spark_reroll_enabled: $("reroll").checked,
    spark_reroll_targets: sparkTargets,
    spark_skill_targets: getReqs(),
    spark_reroll_mode: sparkMode,
    stop_at_spark_reroll: $("stopreroll").checked,
    // The engine reads this as a level, not a flag: 0 never spends, higher
    // values authorise it, carats included.
    allow_recover_tp: $("tp").checked ? 2 : 0,
    team_trials_while_waiting: $("teamtrials").checked,
  };
  $("save").disabled = true;
  try {
    await writeTask(payload);
    note("Task saved");
    closeForm();
    await refresh();
  } catch (e) {
    note("Could not save the task: " + e.message, true);
  } finally {
    $("save").disabled = false;
  }
}

async function act(path, label) {
  try {
    const res = await api(path, { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    note(label);
    await refresh();
  } catch (e) {
    note("Failed: " + e.message, true);
  }
}

async function loadLog(taskId) {
  try {
    const res = await api("/log/" + encodeURIComponent(taskId));
    const data = await res.json();
    const lines = Array.isArray(data) ? data : (data && data.log) || [];
    const el = $("log");
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 24;
    el.textContent = lines.length
      ? lines.slice(-200).map((l) => (typeof l === "string" ? l : JSON.stringify(l))).join("\n")
      : "Nothing logged yet.";
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {
    /* the log is a convenience; never let it break the page */
  }
}

// $("start") is bound in render(), which swaps it between Start and Run again.
$("stop").onclick = () => act("/action/bot/stop", "Stopping");
$("finish").onclick = () => act("/action/bot/stop-after-run", "Will stop after this run");
for (const id of ["tier0", "tier1", "tier2", "blacklist"]) tagBoxes[id] = new TagBox(id);
buildSparks();
loadSkillNames();
$("preset-load").onclick = applyPreset;
$("preset-save").onclick = savePreset;
$("preset-delete").onclick = deletePreset;
$("data-sync").onclick = () => updateGameData("");
$("data-go").onclick = () => updateGameData($("data-path").value.trim());
$("data-prune").onclick = pruneSkills;
showDataVersion();
loadSparkNames();
renderReqs();
loadPresets();
$("skills").onchange = syncBlocks;
$("reroll").onchange = syncBlocks;
$("req-add").onclick = () => { skillReqs.push([]); renderReqs(); };
$("mode-or").onclick = () => { sparkMode = "or"; renderSparks(); };
$("mode-and").onclick = () => { sparkMode = "and"; renderSparks(); };

$("new").onclick = () => openForm();
$("edit").onclick = () => openForm();
$("cancel").onclick = () => closeForm();
$("form").onsubmit = saveTask;
$("delete").onclick = async () => {
  if (!task) return;
  try {
    await api("/task", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_id: task.task_id }),
    });
    note("Task deleted");
    await refresh();
  } catch (e) {
    note("Could not delete the task: " + e.message, true);
  }
};

refresh();
setInterval(refresh, 2000);
</script>
